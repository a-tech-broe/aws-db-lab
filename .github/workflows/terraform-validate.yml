name: terraform validate

# Static checks only -- no AWS credentials, no plan. A plan against real AWS
# needs remote state and an OIDC role; that arrives with the CI/CD work.

on:
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform-validate.yml']
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform-validate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform/

      # Every module is validated on its own, so a module stays reusable
      # instead of only ever being correct in the context of one environment.
      - name: validate modules
        run: |
          for dir in terraform/modules/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - name: validate environments
        run: |
          for dir in terraform/environments/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # -x follows the sourced lib.sh so cross-file usage is checked too;
        # SCRIPTDIR resolves the source= directives regardless of cwd.
        run: shellcheck -x --source-path=SCRIPTDIR scripts/*.sh
